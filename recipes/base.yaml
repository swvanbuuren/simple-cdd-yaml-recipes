{% set locale=locale or "en_US" -%}
{% set keyboard=keyboard or "us" -%}
{% set profile=profile or "base" -%}
{% set mirror_components=mirror_components or "main" -%}
{% set disk_type=disk_type or "DVD" -%}
{% set dist=dist or "trixie" -%}
{% set mirror=mirror or "http://deb.debian.org/debian" -%}
{% set arch=arch or "amd64" -%}
{% set disable_uefi32="'1'" if arch != "i386" else "'0'" %}
{% set nonfree_components=nonfree_components or "" -%}
{% set username=username or "user" -%}
{% set user_fullname=user_fullname or "User" -%}
{% set user_password=user_password or "user" -%}
{% set root_password=root_password or "root" -%}
{% set hostname=hostname or "base" -%}
{% set domain_name=domain_name or "domain" -%}
{% set swapsize_mb=swapsize_mb or "6000" -%}
{% set no_efi_support=no_efi_support or false -%}
{% set debos=debos or false -%}

profile: {{profile}}

actions:
  - action: recipe
    description: Recipe with debos steps
    recipe: recipes/debos.yaml
    variables:
      dist: {{dist}}
      username: {{username}}

  - action: conf
    description: Simple-CDD configuration settings
    variables:
      locale: {{locale}}
      keyboard: {{keyboard}}
      profiles: {{profile}}
      auto_profiles: {{profile}}
      mirror_components: {{mirror_components}}
    env_variables:
      DISKTYPE: {{disk_type}}
      CODENAME: {{dist}}
      DEBIAN_MIRROR: {{mirror}}
      ARCH: {{arch}}
      DISABLE_UEFI_32: {{disable_uefi32}}
      NONFREE_COMPONENTS: {{nonfree_components}}

  - action: preseed
    description: Basic preseed file for minimum Debian system with EFI boot
    preconf: preseeds/base-preseed.txt
    variables:
      user_fullname: {{user_fullname}}
      username: {{username}}
      user_password: {{user_password}}
      root_password: {{root_password}}
      hostname: {{hostname}}
      domain: {{domain_name}}
      swapsize_mb: {{swapsize_mb}}
      no_efi_support: {{no_efi_support}}
      
  - action: apt
    description: Base packages
    packages:
      - adduser
      - apparmor
      - apt
      - apt-transport-https
      - apt-utils
      - busybox
      - ca-certificates
      - dirmngr
      - dos2unix
      - dbus-user-session
      - gnupg
      - initramfs-tools
      - iptables
      - lsb-release
      - openssh-server
      - sudo
      - systemd
      - systemd-timesyncd
      - unattended-upgrades
      - zstd

  - action: downloads
    description: Additional packages for e.g. Debian-CD
    packages:
      - tasksel

  - action: run
    description: Add {{username}} to sudoers
    variables:
      username: {{username}}
    script: scripts/add_sudoer.sh

  - action: run
    description: Add {{username}} to several groups
    variables:
      username: {{username}}
      groups:
        - admin
        - adm
        - dialout
        - cdrom
        - plugdev
        - power
        - audio
        - dip
        - video
        - staff
        - shared
        - sudo
    script: scripts/setup_user_groups.sh

{% if not debos %}

{% if not no_efi_support %}

  - action: run
    description: Make sure debian UEFI file is registered as boot entry
    command: grub-install --efi-directory /boot/efi --force-extra-removable --recheck && update-grub

{% endif %}

  - action: run
    description: Configure grub (output and no menu shown)
    script: scripts/configure_grub.sh

{% endif %}

  - action: overlay
    description: Bash settings for {{username}}
    user: {{username}}
    source: overlays/bash-settings
  
  - action: overlay
    description: Bash settings for root
    user: root
    source: overlays/bash-settings
